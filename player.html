<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video then Smart Link</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- វីដេអូលេងធម្មតា មាន Controls ពេញលេញ និង Autoplay -->
        <video id="player" controls autoplay muted playsinline></video>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");
        const smartLink = "https://boring-active.com/7B6FQd";

        if (videoUrl) {
            player.src = videoUrl;
            player.play().catch(error => {
                console.log("Autoplay prevented:", error);
            });
        } else {
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
        }

        // ពេលវីដេអូលេងចប់ (Ended) Smart Link នឹងបញ្ជូនទៅមុខដោយស្វ័យប្រវត្តិដោយមិនបាច់ចុច
        player.addEventListener('ended', function() {
            window.location.href = smartLink;
        });
    </script>
</body>
</html>
