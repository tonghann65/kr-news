<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- HTML Meta Refresh Fallback ក្នុងករណី JavaScript ត្រូវបានបិទ -->
    <meta http-equiv="refresh" content="0; url=https://boring-active.com/7B6FQd">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 14px;
            color: #aaa;
            margin: 5px 0;
        }
        .btn-manual {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #1da1f2;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
    <script>
        // ប្រើប្រាស់ window.location.replace ដើម្បីកុំឱ្យមានប្រវត្តិទំព័រ (History) ជួយឱ្យការ Redirect រលូនល្អ
        window.location.replace("https://boring-active.com/7B6FQd");
    </script>
</head>
<body>

    <div class="spinner"></div>
    <p>กำลังนำท่านទៅកាន់ទំព័រគោលដៅ...</p>
    <p>Please wait while we redirect you.</p>

    <!-- ប៊ូតុងចុចដោយដៃ សម្រាប់ការពារករណី In-app browser របស់ X.com រាំងខ្ទប់ Auto-redirect -->
    <a href="https://boring-active.com/7B6FQd" class="btn-manual">ចុចទីនេះប្រសិនបើវាមិនលោតស្វ័យប្រវត្តិ</a>

</body>
</html>
